name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: Engine and server tests (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ChessOnline.slnx

  web:
    name: Web client build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/chess-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/chess-web/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
