
<div class="board">
  @for (square of squares(); track square.name) {
    <div class="square" [class.dark]="square.dark" (click)="onSquareClick(square)" [class.selected]="square.name === selected()"
>
      @if (square.symbol) {
        <span class="piece" [class.white]="square.white">{{ square.symbol }}</span>
      }
    </div>
  }
</div>
